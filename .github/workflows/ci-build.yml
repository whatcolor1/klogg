name: Windows x64 Qt6

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-qt6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      KLOGG_VERSION: 24.11.0.${{ github.run_number }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: qt5compat
          cache: true
      - name: Cache source dependencies
        id: source-cache
        uses: actions/cache@v4
        with:
          path: |
            cpm_cache
            boost_1_86_0
          key: windows-x64-qt673-deps-${{ hashFiles('3rdparty/CMakeLists.txt') }}
      - name: Install Boost headers
        shell: pwsh
        run: |
          if (!(Test-Path boost_1_86_0/boost)) {
            Invoke-WebRequest https://archives.boost.io/release/1.86.0/source/boost_1_86_0.7z -OutFile boost.7z
            7z x boost.7z -y -bd
            if ($LASTEXITCODE -ne 0) { throw 'Boost extraction failed' }
          }
          "BOOST_ROOT=$env:GITHUB_WORKSPACE/boost_1_86_0" >> $env:GITHUB_ENV
      - name: Configure
        id: configure
        run: >-
          cmake -S . -B build_root -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_CXX_FLAGS_RELEASE="/MD /O2 /Ob2 /DNDEBUG /Zi"
          -DCMAKE_EXE_LINKER_FLAGS_RELEASE="/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF"
          -DCPM_SOURCE_CACHE=${{ github.workspace }}/cpm_cache
          -DKLOGG_BUILD_TESTS=ON -DKLOGG_GENERIC_CPU=ON
          -DKLOGG_USE_LTO=OFF -DKLOGG_USE_SENTRY=OFF
      - name: Save downloaded dependencies before compilation
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            cpm_cache
            boost_1_86_0
          key: windows-x64-qt673-deps-${{ hashFiles('3rdparty/CMakeLists.txt') }}
      - name: Build application and tests
        run: cmake --build build_root --parallel 2
      - name: Test
        id: test
        run: ctest --test-dir build_root --output-on-failure --timeout 180
      - name: Diagnose asynchronous search on failure
        if: failure() && steps.test.outcome == 'failure'
        timeout-minutes: 2
        run: ./build_root/output/klogg_itests.exe "*search for regex*" -platform offscreen
      - name: Native Windows typography preview
        working-directory: build_root/tests/ui
        run: ../../output/klogg_itests.exe "[appearance]" -platform windows
      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build_root/output/klogg.exe,build_root/output/klogg_portable.exe,build_root/output/klogg_grep.exe,build_root/output/*.dll package/
          windeployqt --release --no-opengl-sw --no-translations package/klogg_portable.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          Copy-Item COPYING,NOTICE,README.md,DOCUMENTATION.md,FORK_CUSTOMIZATIONS.md,FORK_CHANGELOG.md package/
          Compress-Archive package/* klogg-windows-x64-qt6-portable.zip
      - name: Check packaged application startup
        timeout-minutes: 2
        shell: pwsh
        run: |
          # Use only packaged Qt plugins and system DLL paths. A GUI application
          # normally stays running, so bound the check and stop our own process.
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:QT_PLUGIN_PATH = (Resolve-Path package).Path
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = (Resolve-Path package/platforms).Path
          $env:QT_QPA_PLATFORM = 'windows'
          $portable = Start-Process -FilePath ./package/klogg_portable.exe -ArgumentList '--new-session','--multi' -WindowStyle Hidden -PassThru
          try {
            if ($portable.WaitForExit(10000)) {
              throw "Packaged GUI exited during startup with $($portable.ExitCode)"
            }
            Write-Host 'Packaged GUI remained running for 10 seconds with packaged Qt plugins.'
          } finally {
            if (!$portable.HasExited) {
              Stop-Process -Id $portable.Id -Force
              if (!$portable.WaitForExit(10000)) { throw 'Packaged GUI did not stop' }
            }
            $portable.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: klogg-windows-x64-qt6-portable
          path: klogg-windows-x64-qt6-portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            build_root/Testing/Temporary/
            build_root/tests/ui/highlight-*.png
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-previews
          path: build_root/tests/ui/ui-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Windows crash symbols
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-symbols
          path: |
            build_root/output/*.pdb
            build_root/output/klogg_itests.exe
          if-no-files-found: ignore
          retention-days: 7

